name: company-registry

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: companies
      POSTGRES_USER: companies
      POSTGRES_PASSWORD: companies
    ports:
      # 5433 on the host, so it can run next to another local Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companies -d companies"]
      interval: 5s
      timeout: 3s
      retries: 10
  #################
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"   # AMQP: the port the API talks to
      - "15672:15672" # management UI in the browser, login guest / guest

volumes:
  pgdata:

